name: Update ECR Image

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
        default: latest
      environment:
        required: true
        type: string
        default: staging
      image_artifact_name:
        required: false
        type: string
        default: sweri-data-tools-image

    secrets:
      AWS_ECR_IAM_ARN:
        required: true

  workflow_dispatch:

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: sweri-data-tools

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Update latest ECR image
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{secrets.AWS_ECR_IAM_ARN}}
          aws-region: us-west-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'

      - name: Download built image artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.image_artifact_name }}
          path: ${{ runner.temp }}

      - name: Load image from artifact
        run: docker load --input ${{ runner.temp }}/app.tar

      - name: Get tags for backend image
        uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=sha

      - name: Push built image to ECR
        run: |
          docker tag sweri-data-tools:test ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ inputs.tag }}
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ inputs.tag }}
          docker tag sweri-data-tools:test ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
